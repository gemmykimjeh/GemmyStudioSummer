# ============================================================================
# LiteLLM local translator: Anthropic Messages API  <->  LM Studio (OpenAI)
# ----------------------------------------------------------------------------
# Why: the agent tool-loops (ace_react / ace_tau / ace_gdpval / claude_sdk) call
#   anthropic.Anthropic().messages.create(...)  = "Anthropic dialect".
#   LM Studio only speaks the OpenAI dialect. This proxy translates between them.
#
# Run (from the test_benchmark folder):
#   .venv/Scripts/litellm.exe --config configs/litellm_local.yaml --port 4000
#
# Point the agents at it (env when running the harness):
#   ANTHROPIC_BASE_URL=http://localhost:4000
#   (the anthropic SDK reads this env automatically -> no code changes needed)
#
# The ACE brain (Generator/Reflector/Curator) does NOT need this proxy; it hits
#   LM Studio directly via:  harness --api-provider local  (base_url :1234).
#
# NOTE: keep this file ASCII-only. litellm opens it with the OS locale codec
#   (cp949 on Korean Windows), so non-ASCII comments crash the proxy on boot.
# ============================================================================

model_list:
  # Route ANY requested model name (incl. the agents' claude-* default) to Qwen3.
  - model_name: "*"
    litellm_params:
      # "openai/" prefix = treat as an OpenAI-compatible endpoint.
      # The id after it MUST match LM Studio's model id --
      # verify with:  curl http://localhost:1234/v1/models
      model: openai/qwen3-4b
      api_base: http://localhost:1234/v1
      api_key: lm-studio          # local server ignores the key (any value works)
      temperature: 0              # determinism (spec: temp=0). Agents send no temp, so this applies.

litellm_settings:
  drop_params: true               # silently drop params the local model can't accept

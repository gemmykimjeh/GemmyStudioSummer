# ============================================================================
# LiteLLM translator: Anthropic Messages API  <->  Google Gemini (free tier)
# ----------------------------------------------------------------------------
# The ace_gdpval grader uses anthropic.Anthropic().messages.create; this proxy
# translates that to Gemini so the grader runs on the free Gemini API too.
#
# Run (from test_benchmark):
#   PYTHONUTF8=1 .venv/Scripts/litellm.exe --config configs/litellm_gemini.yaml --port 4000
# Point the grader at it:  ANTHROPIC_BASE_URL=http://localhost:4000
# The ACE brain (Generator/Reflector/Curator) hits Gemini directly via
#   ACE_API_PROVIDER=gemini (utils.py -> OpenAI-compat base_url). No proxy needed for it.
#
# Needs GEMINI_API_KEY in the environment (free key from AI Studio).
# ============================================================================

model_list:
  # Any requested model name (incl. the grader's default claude-*) -> Gemini.
  - model_name: "*"
    litellm_params:
      model: gemini/gemini-3.1-flash-lite   # pinned for A/B reproducibility
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true
